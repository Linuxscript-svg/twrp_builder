name: Build TWRP OWW251 (hosted, /mnt disk + ubuntu20 container)

# 目标：本机没内存/没大盘，用 GitHub 免费托管 runner 编 Android 11 的 TWRP。
# 设计（针对上一版失败原因修正）：
#  - 不再用 maximize-build-space 搬根目录（上次它导致 docker 在搬完后被硬中断）。
#  - GitHub runner 自带一块 /mnt 数据盘（约 65-74GB），把 docker 数据目录和源码都放这里，
#    根盘（约 14GB 可用）只放系统，不受影响。
#  - 编译跑在 ubuntu:20.04 容器里（AOSP 11 的真依赖：openjdk-8 / python2 / lib32ncurses5）。

on:
  workflow_dispatch:
    inputs:
      DEVICE_URL:
        description: 'DEVICE_URL'
        required: true
        default: 'https://github.com/Linuxscript-svg/android_device_oppo_OWW251'
      DEVICE_BRANCH:
        description: 'DEVICE_BRANCH'
        required: true
        default: 'master'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/oppo/OWW251'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'OWW251'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recoveryimage'

env:
  TZ: Asia/Shanghai
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp
  MANIFEST_BRANCH: twrp-11
  PRODUCT: omni_OWW251
  BUILD_DIR: /mnt/oww251

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: 磁盘与内核参数自检
      run: |
        echo "=== 磁盘 ==="; df -h
        echo "=== /mnt ==="; ls -ld /mnt; df -h /mnt || true
        echo "=== CPU/内存 ==="; nproc; free -g
        echo "=== docker ==="; docker version --format '{{.Server.Version}}' || true

    - name: 把 docker 数据目录与构建目录放到 /mnt
      run: |
        set -e
        sudo df -h /mnt
        sudo mkdir -p /mnt/docker /mnt/oww251
        sudo chown -R "$USER":"$USER" /mnt/oww251
        # docker 数据目录换到 /mnt，避免根盘（~14GB）被镜像和 overlay 撑爆
        sudo systemctl stop docker || true
        echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl start docker
        sleep 3
        docker info --format 'data-root={{.DockerRootDir}}  driver={{.Driver}}'
        sudo df -h /mnt

    - name: 拉取 ubuntu:20.04
      run: |
        for i in 1 2; do
          docker pull ubuntu:20.04 && break || { echo "第 $i 次失败，重试"; sleep 5; }
        done
        docker image inspect ubuntu:20.04 --format 'image ok: {{.Id}}'

    - name: 编译（容器内）
      run: |
        set -e
        mkdir -p "$BUILD_DIR/workspace"
        cat > "$RUNNER_TEMP/inner.sh" <<'EOS'
        #!/bin/bash
        set -e
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get install -y --no-install-recommends \
          git gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
          unzip jq bc ccache rsync tree python2 libssl-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libwxgtk3.0-dev openjdk-8-jdk \
          squashfs-tools pngcrush lzop imagemagick qemu-user-static
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
        chmod +x /usr/local/bin/repo
        git config --global user.name "Build Bot"
        git config --global user.email "build@localhost"
        git config --global --add safe.directory '*'
        echo "=== 容器内磁盘 ==="; df -h /workspace

        cd /workspace
        if [ ! -d .repo ]; then
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
        fi
        echo "=== repo sync ==="
        repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle

        echo "=== 克隆设备树 ==="
        if [ -d "$DEVICE_PATH/.git" ]; then
          git -C "$DEVICE_PATH" fetch origin "$DEVICE_BRANCH" && git -C "$DEVICE_PATH" checkout "$DEVICE_BRANCH"
        else
          git clone "$DEVICE_URL" -b "$DEVICE_BRANCH" "./$DEVICE_PATH"
        fi

        echo "=== 编译 ==="
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        lunch "${PRODUCT}-eng"
        make clean
        # shellcheck disable=SC2086
        mka $BUILD_TARGET -j"$(nproc --all)"

        echo "=== 收产物 ==="
        mkdir -p /workspace/dist
        OUT="/workspace/out/target/product/$DEVICE_NAME"
        cp -v "$OUT"/*.img "$OUT"/*.zip /workspace/dist/ 2>/dev/null || echo "无 .img/.zip 产物"
        ls -lh /workspace/dist || true
        EOS
        chmod +x "$RUNNER_TEMP/inner.sh"
        docker run --rm \
          -v "$BUILD_DIR/workspace":/workspace \
          -v "$RUNNER_TEMP/inner.sh":/inner.sh:ro \
          -e MANIFEST_URL="$MANIFEST_URL" \
          -e MANIFEST_BRANCH="$MANIFEST_BRANCH" \
          -e PRODUCT="$PRODUCT" \
          -e DEVICE_URL="${{ github.event.inputs.DEVICE_URL }}" \
          -e DEVICE_BRANCH="${{ github.event.inputs.DEVICE_BRANCH }}" \
          -e DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}" \
          -e DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}" \
          -e BUILD_TARGET="${{ github.event.inputs.BUILD_TARGET }}" \
          ubuntu:20.04 bash /inner.sh

    - name: 汇总信息
      if: always()
      run: |
        df -h / /mnt || true
        du -sh "$BUILD_DIR" 2>/dev/null || true
        ls -lh "$BUILD_DIR/workspace/dist" 2>/dev/null || echo "没有产物"

    - name: 上传 artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          /mnt/oww251/workspace/dist/*.img
          /mnt/oww251/workspace/dist/*.zip
        if-no-files-found: warn

    - name: 发布 Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          /mnt/oww251/workspace/dist/*.img
          /mnt/oww251/workspace/dist/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: TWRP for ${{ github.event.inputs.DEVICE_NAME }} (android-11 / twrp-11)
      env:
        GITHUB_TOKEN: ${{ secrets.work }}
