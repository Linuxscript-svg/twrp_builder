name: Build TWRP OWW251 (hosted, ubuntu20 container)

# 适用场景：本机没内存/没大盘，用 GitHub 免费托管 runner 编译 Android 11 的 TWRP。
# 关键点：
#  1) 托管 runner 现在只有 ubuntu-latest(24.04)，但 AOSP 11 需要 20.04 的依赖 —— 所以编译跑在
#     ubuntu:20.04 容器里（docker run，不是 container: 关键字，这样宿主步骤还能清理磁盘）。
#  2) 磁盘靠 maximize-build-space 把 /usr/share/dotnet 等挪走，腾出 ~50GB。
#  3) 源码放在 bind mount 里（$GITHUB_WORKSPACE/workspace），产物出门后由 upload-artifact 收走。

on:
  workflow_dispatch:
    inputs:
      DEVICE_URL:
        description: 'DEVICE_URL'
        required: true
        default: 'https://github.com/Linuxscript-svg/android_device_oppo_OWW251'
      DEVICE_BRANCH:
        description: 'DEVICE_BRANCH'
        required: true
        default: 'master'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/oppo/OWW251'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'OWW251'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
default: 'recoveryimage'

env:
  TZ: Asia/Shanghai
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp
  MANIFEST_BRANCH: twrp-11
  PRODUCT: omni_OWW251

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: 腾磁盘（把 root 挪到 /mnt，删 dotnet/android/haskell）
      uses: easimon/maximize-build-space@v6
      with:
        root-reserve-mb: 2048
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: 宿主机自检
      run: |
        . /etc/os-release; echo "runner: $PRETTY_NAME"
        echo "CPU $(nproc) 核  内存 $(free -g | awk 'NR==2{print $2}')GB"
        df -h | grep -E "Filesystem|/mnt|/workspace|/$"

    - name: 拉取 ubuntu:20.04
      run: docker pull ubuntu:20.04

    - name: 编译（容器内）
      run: |
        set -e
        mkdir -p "$GITHUB_WORKSPACE/workspace"
        cat > /tmp/inner.sh <<'EOS'
#!/bin/bash
        set -e
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get install -y --no-install-recommends \
          git gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
          unzip jq bc ccache rsync tree python2 libssl-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libwxgtk3.0-dev openjdk-8-jdk \
          squashfs-tools pngcrush lzop imagemagick qemu-user-static
        # repo 工具
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
        chmod +x /usr/local/bin/repo
        git config --global user.name "Build Bot"
        git config --global user.email "build@localhost"
        git config --global --add safe.directory '*'

        cd /workspace
        if [ ! -d .repo ]; then
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
fi
        repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle

        if [ -d "$DEVICE_PATH/.git" ]; then
          git -C "$DEVICE_PATH" fetch origin "$DEVICE_BRANCH"
          git -C "$DEVICE_PATH" checkout "$DEVICE_BRANCH"
        else
          git clone "$DEVICE_URL" -b "$DEVICE_BRANCH" "./$DEVICE_PATH"
        fi

        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export USE_CCACHE=0
        source build/envsetup.sh
        lunch "${PRODUCT}-eng"
        make clean
        # shellcheck disable=SC2086
        mka $BUILD_TARGET -j"$(nproc --all)"

        mkdir -p /workspace/dist
        OUT="/workspace/out/target/product/$DEVICE_NAME"
        cp -v "$OUT"/*.img "$OUT"/*.zip /workspace/dist/ 2>/dev/null || true
        ls -lh /workspace/dist || true
        EOS
        chmod +x /tmp/inner.sh
        docker run --rm \
          -v "$GITHUB_WORKSPACE/workspace":/workspace \
          -v /tmp/inner.sh:/inner.sh:ro \
          -e MANIFEST_URL="$MANIFEST_URL" \
-e MANIFEST_BRANCH="$MANIFEST_BRANCH" \
          -e PRODUCT="$PRODUCT" \
          -e DEVICE_URL="${{ github.event.inputs.DEVICE_URL }}" \
          -e DEVICE_BRANCH="${{ github.event.inputs.DEVICE_BRANCH }}" \
          -e DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}" \
          -e DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}" \
          -e BUILD_TARGET="${{ github.event.inputs.BUILD_TARGET }}" \
          ubuntu:20.04 bash /inner.sh

    - name: 汇总信息
      if: always()
      run: |
        df -h | grep -E "Filesystem|/mnt|/$" || true
        du -sh "$GITHUB_WORKSPACE/workspace" 2>/dev/null || true
        ls -lh "$GITHUB_WORKSPACE/workspace/dist" 2>/dev/null || echo "没有产物"

    - name: 上传 artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          workspace/dist/*.img
          workspace/dist/*.zip
        if-no-files-found: warn

    - name: 发布 Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/dist/*.img
          workspace/dist/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: TWRP for ${{ github.event.inputs.DEVICE_NAME }} (android-11 / twrp-11)
      env:
        GITHUB_TOKEN: ${{ secrets.work }}
