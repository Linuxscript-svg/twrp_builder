name: Make nabu Recovery (self-hosted)

# 用你自己的服务器跑：GitHub 托管的 ubuntu-20.04 / 22.04 都已下线，
# 而 AOSP 11 在 24.04 上基本编不动（没有 python2 / openjdk-8 / libncurses5）。
# 自建 runner 是这台设备最省事的方案。

on:
  workflow_dispatch:
    inputs:
      LIBRARY_NAME:
        description: 'LIBRARY_NAME'
        required: true
        default: 'twrp'
      LIBRARY_URL:
        description: 'LIBRARY_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      LIBRARY_BRANCH:
        description: 'LIBRARY_BRANCH'
        required: true
        default: 'twrp-11'
      DEVICE_URL:
        description: 'DEVICE_URL'
        required: true
        default: 'https://github.com/bm0x/android_device_xiaomi_nabu'
      DEVICE_BRANCH:
        description: 'DEVICE_BRANCH'
        required: true
        default: 'a11'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/nabu'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'nabu'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'adbd bootimage'

env:
  TZ: Asia/Shanghai
  WORKDIR: ${{ github.workspace }}/build

jobs:
  build:
    # 只要 runner 上带 self-hosted 标签就会被选中；不需要 ubuntu-20.04 这种托管标签
    runs-on: [self-hosted, linux]
    timeout-minutes: 720

    steps:
    - name: 环境自检
      run: |
        . /etc/os-release
        echo "系统：$PRETTY_NAME"
        echo "CPU：$(nproc) 核  内存：$(free -g | awk 'NR==2{print $2}') GB"
        echo "可用磁盘：$(df -h "$WORKDIR" 2>/dev/null | awk 'NR==2{print $4}')"
        command -v repo || echo "缺 repo（脚本会自动装）"

    # 自建 runner 上不需要 maximize-build-space（那是为了撑爆 GitHub 的 14GB 盘）
    - name: Check Out
      uses: actions/checkout@v4

    - name: 依赖检查与安装
      run: |
        MISSING=""
        for p in git curl repo ccache zip unzip rsync jq bc tree python3 flex bison gperf; do
          command -v "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"
        done
        if [ -n "$MISSING" ]; then
          echo "缺少：$MISSING"
          sudo apt-get update -y
          sudo apt-get -y install git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 ccache rsync bc tree jq \
            lib32z1-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            libncurses5-dev libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev libssl-dev lzma ncftp bash-completion python2 qemu-user-static || true
          sudo apt-get -y install libwxgtk3.0-dev openjdk-8-jdk || \
          sudo apt-get -y install libwxgtk3.0-gtk3-dev openjdk-11-jdk || true
        else
          echo "依赖齐全"
        fi
        command -v repo >/dev/null 2>&1 || { mkdir -p "$HOME/bin"; curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"; chmod +x "$HOME/bin/repo"; echo "$HOME/bin" >> "$GITHUB_PATH"; }

    - name: repo init
      run: |
        mkdir -p "$WORKDIR/workspace"
        cd "$WORKDIR/workspace"
        git config --global user.name "Build Bot"
        git config --global user.email "build@localhost"
        if [ ! -d .repo ]; then
          repo init --depth=1 -u "${{ github.event.inputs.LIBRARY_URL }}" -b "${{ github.event.inputs.LIBRARY_BRANCH }}"
        fi

    - name: repo sync
      run: |
        cd "$WORKDIR/workspace"
        repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle

    - name: 克隆设备树
      run: |
        cd "$WORKDIR/workspace"
        if [ -d "${{ github.event.inputs.DEVICE_PATH }}/.git" ]; then
          git -C "${{ github.event.inputs.DEVICE_PATH }}" fetch origin "${{ github.event.inputs.DEVICE_BRANCH }}"
          git -C "${{ github.event.inputs.DEVICE_PATH }}" checkout "${{ github.event.inputs.DEVICE_BRANCH }}"
          git -C "${{ github.event.inputs.DEVICE_PATH }}" pull --ff-only || true
        else
          git clone "${{ github.event.inputs.DEVICE_URL }}" -b "${{ github.event.inputs.DEVICE_BRANCH }}" "./${{ github.event.inputs.DEVICE_PATH }}"
        fi
        [ -d hardware/xiaomi/.git ] || git clone https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-18.1 ./hardware/xiaomi || true

    - name: 编译
      run: |
        cd "$WORKDIR/workspace"
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export USE_CCACHE=1
        export CCACHE_DIR="$WORKDIR/.ccache"
        ccache -M 30G || true
        source build/envsetup.sh
        lunch "${{ github.event.inputs.LIBRARY_NAME }}_${{ github.event.inputs.DEVICE_NAME }}-eng"
        make clean && make clobber
        mka ${{ github.event.inputs.BUILD_TARGET }} -j"$(nproc --all)"

    - name: 收产物
      if: always()
      run: |
        OUT="$WORKDIR/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        DST="$WORKDIR/artifacts/$(date +%F_%H%M)"
        mkdir -p "$DST"
        cp -v "$OUT"/*.zip "$OUT"/*.img "$DST"/ 2>/dev/null || echo "没有产物，检查 $OUT"
        ls -lh "$DST"

    - name: 上传 artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          build/artifacts/**/*.zip
          build/artifacts/**/*.img
        if-no-files-found: warn

    - name: 发布 Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/artifacts/**/*.zip
          build/artifacts/**/*.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: Recovery for ${{ github.event.inputs.DEVICE_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.work }}
